# CI cho mọi PR và mỗi lần merge vào main:
#   1. go vet + go test -race với đúng phiên bản Go trong go.mod
#   2. build Dockerfile thật, chạy docker compose và scripts/fault-demo.sh
# Kết quả và log lỗi được ghi thành annotation để xem nhanh trong tab Checks của PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go vet + test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./... 2>&1 | tee vet.log
      - name: go test -race
        run: |
          go test -race -count=1 ./... 2>&1 | tee test.log
          echo "::notice title=Go test::$(go version) — $(grep -c '^ok' test.log) package(s) ok"
      - name: Report failure
        if: failure()
        run: .github/report-logs.sh

  docker:
    name: Docker compose + fault demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: docker compose build 2>&1 | tee build.log
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 120 2>&1 | tee up.log
      - name: Fault injection demo
        run: |
          ./scripts/fault-demo.sh 2>&1 | tr '\r' '\n' | grep -v 'đã xử lý [0-9]*/' | tee demo.log
          echo "::notice title=Fault demo::$(grep '✅' demo.log) | $(grep 'Agent B:' demo.log)"
      - name: Collect container logs
        if: failure()
        run: docker compose logs --no-color > compose.log 2>&1 || true
      - name: Report failure
        if: failure()
        run: .github/report-logs.sh
      - name: Stop stack
        if: always()
        run: docker compose down

  server:
    name: Server config smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start server stack from .env.example
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180 2>&1 | tee up.log
          docker compose ps 2>&1 | tee -a up.log
      - name: Smoke test
        run: |
          curl -fsS localhost:8080/healthz | tee smoke.log
          fault=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/admin/fault)
          [ "$fault" = 404 ] || { echo "/admin/fault must be disabled on the server, got HTTP $fault" | tee -a smoke.log; exit 1; }
          if curl -s -m 2 -o /dev/null localhost:8081/stats; then echo "test-agent port 8081 must not be published" | tee -a smoke.log; exit 1; fi
          curl -fsS -X POST localhost:8080/send -H 'Content-Type: application/json' -H 'X-Trace-Id: smoke-ci' \
            -d "{\"message_id\":\"smoke-ci\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"from\":\"ci\",\"to\":\"agent_B\",\"type\":\"request\",\"payload\":{\"ping\":true}}" | tee -a smoke.log
          for i in $(seq 1 20); do docker compose logs test-agent 2>&1 | grep -q 'processed message smoke-ci' && break; sleep 1; done
          docker compose logs test-agent 2>&1 | grep 'processed message smoke-ci' | tee -a smoke.log
          echo "::notice title=Server config::broker healthy, /admin/fault=404, port 8081 closed, smoke-ci delivered to test-agent"
      - name: Two-agent demo (scripts/demo-agents.sh, DEMO.md)
        run: |
          ./scripts/demo-agents.sh start 2>&1 | tee agents-start.log
          # Chạy trong terminal giả lập (script) như khi người dùng gõ qua SSH; quá 90 giây là treo.
          for scenario in ask retry offline; do
            timeout 90 script -qec "./scripts/demo-agents.sh $scenario" /dev/null 2>&1 | tee "agents-$scenario.log" \
              || { echo "$scenario: failed or hung (exit ${PIPESTATUS[0]})" | tee -a agents-check.log; exit 1; }
          done
          check() { grep -q "$2" "agents-$1.log" || { echo "$1: missing '$2'" | tee -a agents-check.log; exit 1; }; }
          for scenario in ask retry offline; do check "$scenario" 'Hoàn tất: dieu_phoi'; done
          check retry 'No ACK yet'
          check retry 'đang xử lý dở'
          check offline 'Delivery attempt failed'
          check offline '\[tin_tuc\] nhận REQUEST'
          # Dòng "gửi REQUEST" phải hiện trước log broker nhận tin.
          sent=$(grep -n 'gửi REQUEST' agents-ask.log | head -1 | cut -d: -f1)
          accepted=$(grep -n 'Accepted message' agents-ask.log | head -1 | cut -d: -f1)
          [ "$sent" -lt "$accepted" ] || { echo "ask: 'gửi REQUEST' (line $sent) after 'Accepted' (line $accepted)" | tee -a agents-check.log; exit 1; }
          echo "::notice title=Agent demo::ask, retry, offline OK; tin_tuc ACK sau $(grep -o 'from tin_tuc .*after [0-9]* attempt' agents-*.log | grep -o '[0-9]* attempt' | tr '\n' ' ')"
      - name: Laptop agent without a webhook (GET /receive, DEMO.md kịch bản 4)
        run: |
          # The runner plays the laptop: outside the Docker network, no route, it only calls the broker.
          export BROKER_URL=http://127.0.0.1:8080 AGENT_ID=laptop_ci PYTHONDONTWRITEBYTECODE=1
          python3 -u examples/python/agent.py poll > laptop.log 2>&1 &
          poll_pid=$!
          sleep 2
          python3 examples/python/agent.py send tin_tuc "tin cong nghe" | tee laptop-send.log
          for _ in $(seq 1 30); do grep -q 'đã gửi ACK success' laptop.log && break; sleep 1; done
          kill "$poll_pid" || true
          cat laptop.log
          grep -q 'nhận response .* từ tin_tuc' laptop.log || { echo "laptop agent got no response from tin_tuc" | tee -a agents-check.log; exit 1; }
          docker compose logs broker | grep -q 'Agent laptop_ci pulled message' || { echo "broker did not hand the reply over GET /receive" | tee -a agents-check.log; exit 1; }
          if python3 examples/python/agent.py send khong_ton_tai "xin chao" > unknown.log 2>&1; then
            echo "send to an unknown agent succeeded" | tee -a agents-check.log; exit 1
          fi
          grep -q 'HTTP 404' unknown.log || { cat unknown.log | tee -a agents-check.log; exit 1; }
          echo "::notice title=Pull mode::laptop agent with no webhook got tin_tuc's answer via GET /receive; unknown recipient -> 404"
      - name: Collect container logs
        if: failure()
        run: docker compose logs --no-color > compose.log 2>&1 || true
      - name: Report failure
        if: failure()
        run: .github/report-logs.sh
      - name: Stop stack
        if: always()
        run: docker compose down
